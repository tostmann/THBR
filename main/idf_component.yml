## Component Manager dependencies for the THBR main component.
##
## OpenThread is a built-in IDF component — no registry entry needed.
dependencies:
  espressif/mdns: "^1.5.0"
  ## WebSocket-Client fuer den BLE-Proxy zum Matter-Server.
  espressif/esp_websocket_client: "^1.8.0"
  espressif/cjson: "*"
  ## REST API + web GUI, ot-br-posix-compatible (/node, /node/dataset/active,
  ## /node/state, /diagnostics ...) — this is what lets Home Assistant's OTBR
  ## integration import the dataset and commission Matter-over-Thread devices,
  ## rather than merely discovering the router over mDNS.  Lives in the
  ## esp-thread-br SDK, not the registry, hence the git path dependency.
  ## Pinned to our fork: the upstream /diagnostics handler builds the JSON for
  ## the whole mesh in the heap before sending, which peaks hard and leaks one
  ## router's JSON whenever a client gives up part way through the response.
  ## The fork streams the set one router at a time.  Still present in upstream
  ## main as of 0bad9f1 -- drop the fork once it is merged there.
  ## On top of that it carries espressif/esp-thread-br#221 (cherry-picked):
  ## /get_properties copied 17 bytes out of the 8-byte mesh-local prefix and
  ## reported it as fd..:fe80:...:8ce0/140.
  espressif/esp_ot_br_server:
    git: https://github.com/tostmann/esp-thread-br.git
    path: components/esp_ot_br_server
    version: 4702be7882b6abc5d10d5934ce7ff4ec108e9119
  ## Pulled in because esp_ot_br_server PRIV_REQUIREs it.  Kept inert: all
  ## EXAMPLE_CONNECT_* options are off, we bring up the backbone ourselves.
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
  idf: ">=5.3.0"
