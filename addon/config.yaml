# Home Assistant add-on manifest.  The same directory is also the build context
# for the plain-Docker image (docker build -t thbr addon/).
name: THBR Thread Border Router
version: "2026.8.37"
slug: thbr
description: Thread border router on an ESP32-C6 stick, reached over its USB port — no Ethernet chip, no radio co-processor on this machine.
url: https://github.com/tostmann/THBR

# Published per architecture on Docker Hub, tagged with the version above, so
# installing is a pull rather than a ten-minute build on the user's machine.
# Removing this line is what makes the Supervisor build the directory locally
# instead — which is what you want when working on the add-on itself.
image: "tostmann/thbr-{arch}"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# The tap device has to live in the host's network namespace: Home Assistant
# binds its mDNS sockets per interface, and the border router's advertisements
# must reach the host itself.
host_network: true

# NET_ADMIN: create the tap, address it, install the route into the mesh.
# NET_RAW:   send a router solicitation so the border router answers at once
#            instead of at its own pace.
privileged:
  - NET_ADMIN
  - NET_RAW

# The tap itself.  The stick's serial port comes from the `device` option, which
# the Supervisor maps in; uart additionally covers the port coming back under a
# different name after a firmware flash.
devices:
  - /dev/net/tun
uart: true

# The add-on's own page in the Home Assistant sidebar: status, an update
# button, a restart button, and a pass-through to the border router's GUI —
# which otherwise sits unreachable on the private backbone.
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: Thread BR

options:
  device: null
  flash: auto
schema:
  device: device(subsystem=tty)
  flash: list(auto|upgrade|never)
  tap: str?
  host_addr: str?
  stick_addr: str?
  web_allow: str?
  stick_log: list(quiet|all|off)?
